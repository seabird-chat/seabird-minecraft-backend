license = "MIT"
issueTrackerURL = "https://github.com/seabird-chat/seabird-minecraft-backend/issues"

modLoader="javafml"
loaderVersion="[1,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "belak"
description = "A chat backend to export a Minecraft server as a chat channel"

logoFile = "assets/template/icon.png"
displayURL = "https://github.com/seabird-chat/seabird-minecraft-backend/"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
#versionRange = "${minecraft}"
versionRange = "*"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "architectury"
mandatory = true
versionRange = "[${architectury_api},)"
ordering = "AFTER"
side = "BOTH"
